<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 30" width="360" height="30">
  <defs>
    <style>
      .tile-outline {
        stroke: #ffffff;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .tile-fill {
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- ── 0. MASSKARA MASK (Purple) ── -->
  <rect x="0" y="0" width="30" height="30" fill="#924A96"/>
  <g class="tile-outline">
    <!-- Fan headdress loops -->
    <path d="M8 11 C8 5 15 5 15 11 C15 5 22 5 22 11"/>
    <path d="M12 9 C12 3 18 3 18 9"/>
    <!-- Smiling face silhouette -->
    <path d="M8 12 C8 23 22 23 22 12"/>
    <!-- Joyful smile -->
    <path d="M10.5 16.5 Q15 21.5 19.5 16.5"/>
    <!-- Eyes -->
    <path d="M10 13 Q12 11.5 14 13"/>
    <path d="M16 13 Q18 11.5 20 13"/>
  </g>

  <!-- ── 1. THE RUINS COLUMNS (Orange) ── -->
  <rect x="30" y="0" width="30" height="30" fill="#EE6327"/>
  <g class="tile-outline">
    <!-- Pediment -->
    <polygon points="45 7 35 13 55 13"/>
    <line x1="34" y1="14" x2="56" y2="14"/>
    <!-- Neoclassical Columns -->
    <line x1="37" y1="14" x2="37" y2="23"/>
    <line x1="42" y1="14" x2="42" y2="23"/>
    <line x1="48" y1="14" x2="48" y2="23"/>
    <line x1="53" y1="14" x2="53" y2="23"/>
    <!-- Plinth -->
    <rect x="33" y="23" width="24" height="2"/>
  </g>
  <circle cx="45" cy="10.5" r="1.2" class="tile-fill"/>

  <!-- ── 2. SUGARCANE STALKS (Blue) ── -->
  <rect x="60" y="0" width="30" height="30" fill="#0C76BA"/>
  <g class="tile-outline">
    <line x1="72" y1="26" x2="72" y2="5"/>
    <line x1="70" y1="11" x2="74" y2="11"/>
    <line x1="70" y1="18" x2="74" y2="18"/>
    <line x1="78" y1="26" x2="80" y2="7"/>
    <line x1="76" y1="14" x2="81" y2="13.5"/>
    <!-- Curved cane leaves -->
    <path d="M72 11 Q64 9 63 13"/>
    <path d="M72 5 Q77 3 84 6"/>
    <path d="M79 14 Q85 16 87 20"/>
  </g>

  <!-- ── 3. SAN SEBASTIAN CATHEDRAL (Yellow) ── -->
  <rect x="90" y="0" width="30" height="30" fill="#FBB03B"/>
  <g class="tile-outline">
    <!-- Left Tower -->
    <path d="M94 14 V24 H99 V14 Z"/>
    <path d="M94 14 C94 10.5 99 10.5 99 14"/>
    <line x1="96.5" y1="10.5" x2="96.5" y2="7"/>
    <!-- Right Tower -->
    <path d="M111 14 V24 H116 V14 Z"/>
    <path d="M111 14 C111 10.5 116 10.5 116 14"/>
    <line x1="113.5" y1="10.5" x2="113.5" y2="7"/>
    <!-- Center Nave & Cross -->
    <path d="M99 17 L105 12 L111 17 V24 H99 Z"/>
    <line x1="105" y1="12" x2="105" y2="6"/>
    <line x1="103" y1="8" x2="107" y2="8"/>
    <circle cx="105" cy="16" r="2"/>
    <path d="M103 24 V20.5 A2 2 0 0 1 107 20.5 V24"/>
  </g>

  <!-- ── 4. CHICKEN INASAL SKEWER (Orange) ── -->
  <rect x="120" y="0" width="30" height="30" fill="#EE6327"/>
  <g class="tile-outline">
    <!-- Skewer stick -->
    <line x1="124" y1="26" x2="146" y2="4"/>
    <!-- Skewered pieces -->
    <path d="M138 9 C143 6 146 10 142 14 C138 17 134 13 138 9 Z"/>
    <path d="M130 16 C134 13 137 17 133 21 C129 23 127 19 130 16 Z"/>
    <!-- Grill flame/smoke aroma -->
    <path d="M141 4 Q143 2 145 4"/>
    <path d="M145 7 Q147 5 148 8"/>
  </g>

  <!-- ── 5. FESTIVAL SUNBURST (Purple) ── -->
  <rect x="150" y="0" width="30" height="30" fill="#924A96"/>
  <g class="tile-outline">
    <circle cx="165" cy="15" r="5.5"/>
    <path d="M162.5 15.5 Q165 18 167.5 15.5"/>
    <!-- Rays -->
    <line x1="165" y1="6.5" x2="165" y2="3.5"/>
    <line x1="165" y1="23.5" x2="165" y2="26.5"/>
    <line x1="156.5" y1="15" x2="153.5" y2="15"/>
    <line x1="173.5" y1="15" x2="176.5" y2="15"/>
    <line x1="159" y1="9" x2="157" y2="7"/>
    <line x1="171" y1="21" x2="173" y2="23"/>
    <line x1="159" y1="21" x2="157" y2="23"/>
    <line x1="171" y1="9" x2="173" y2="7"/>
  </g>
  <circle cx="163" cy="13.5" r="0.8" class="tile-fill"/>
  <circle cx="167" cy="13.5" r="0.8" class="tile-fill"/>

  <!-- ── 6. PLAZA BANDSTAND GAZEBO (Yellow) ── -->
  <rect x="180" y="0" width="30" height="30" fill="#FBB03B"/>
  <g class="tile-outline">
    <!-- Cupola dome -->
    <path d="M184 13 Q195 6 206 13 Z"/>
    <line x1="195" y1="6" x2="195" y2="4"/>
    <!-- Pillars -->
    <line x1="186" y1="13" x2="186" y2="22"/>
    <line x1="191" y1="13" x2="191" y2="22"/>
    <line x1="199" y1="13" x2="199" y2="22"/>
    <line x1="204" y1="13" x2="204" y2="22"/>
    <!-- Balustrade & base -->
    <line x1="184" y1="18" x2="206" y2="18" stroke-dasharray="1.2 1.5"/>
    <rect x="183" y="22" width="24" height="2.5" rx="0.5"/>
  </g>
  <circle cx="195" cy="3.5" r="0.8" class="tile-fill"/>

  <!-- ── 7. MASSKARA STREET DRUM (Blue) ── -->
  <rect x="210" y="0" width="30" height="30" fill="#0C76BA"/>
  <g class="tile-outline">
    <!-- Drum body -->
    <ellipse cx="225" cy="11" rx="8.5" ry="3.2"/>
    <line x1="216.5" y1="11" x2="216.5" y2="21"/>
    <line x1="233.5" y1="11" x2="233.5" y2="21"/>
    <path d="M216.5 21 C216.5 24.2 233.5 24.2 233.5 21"/>
    <!-- Tension cord zigzag -->
    <polyline points="216.5 11 221 22 225 12 229 22 233.5 12"/>
    <!-- Drumsticks -->
    <line x1="214" y1="6" x2="227" y2="12"/>
    <line x1="236" y1="6" x2="223" y2="12"/>
  </g>

  <!-- ── 8. PIAYA DELICACY (Orange) ── -->
  <rect x="240" y="0" width="30" height="30" fill="#EE6327"/>
  <g class="tile-outline">
    <circle cx="255" cy="15" r="9"/>
    <circle cx="255" cy="15" r="6.2" stroke-dasharray="2 2"/>
  </g>
  <!-- Sesame seeds -->
  <circle cx="253" cy="12.5" r="0.8" class="tile-fill"/>
  <circle cx="257.5" cy="12.8" r="0.8" class="tile-fill"/>
  <circle cx="255" cy="15.5" r="0.8" class="tile-fill"/>
  <circle cx="252.5" cy="17.2" r="0.8" class="tile-fill"/>
  <circle cx="257" cy="17" r="0.8" class="tile-fill"/>

  <!-- ── 9. TRIBAL GEOMETRIC WEAVE (Purple) ── -->
  <rect x="270" y="0" width="30" height="30" fill="#924A96"/>
  <g class="tile-outline">
    <!-- Diamond -->
    <polygon points="285 5 295 15 285 25 275 15"/>
    <polygon points="285 9.5 290.5 15 285 20.5 279.5 15"/>
    <!-- Corner tribal brackets -->
    <polyline points="272 9 275 6 278 6"/>
    <polyline points="292 6 295 6 298 9"/>
    <polyline points="272 21 275 24 278 24"/>
    <polyline points="292 24 295 24 298 21"/>
  </g>
  <circle cx="285" cy="15" r="1.3" class="tile-fill"/>

  <!-- ── 10. HEADDRESS CROWN (Blue) ── -->
  <rect x="300" y="0" width="30" height="30" fill="#0C76BA"/>
  <g class="tile-outline">
    <!-- Crown band -->
    <path d="M304 23 Q315 20 326 23"/>
    <!-- Feather plumes -->
    <path d="M315 17 C312 11 313 5 315 4 C317 5 318 11 315 17 Z"/>
    <path d="M312 18 C308 13 306 8 308.5 6.5 C311 8 313 13 312 18 Z"/>
    <path d="M318 18 C322 13 324 8 321.5 6.5 C319 8 317 13 318 18 Z"/>
    <path d="M309 20 C305 16.5 303 12 305 10 C307 12 309 16 309 20 Z"/>
    <path d="M321 20 C325 16.5 327 12 325 10 C323 12 321 16 321 20 Z"/>
  </g>
  <circle cx="315" cy="19.5" r="1.5" class="tile-fill"/>

  <!-- ── 11. FESTIVAL BLOOM & SMILE (Yellow) ── -->
  <rect x="330" y="0" width="30" height="30" fill="#FBB03B"/>
  <g class="tile-outline">
    <!-- 4-Petal Sun Flower -->
    <path d="M345 12 C343 8 347 8 345 12 Z"/>
    <path d="M348 15 C352 13 352 17 348 15 Z"/>
    <path d="M345 18 C347 22 343 22 345 18 Z"/>
    <path d="M342 15 C338 17 338 13 342 15 Z"/>
    <!-- Decorative corner accents -->
    <path d="M333 7 A3 3 0 0 1 336 4"/>
    <path d="M357 4 A3 3 0 0 1 357 7"/>
    <path d="M333 23 A3 3 0 0 0 336 26"/>
    <path d="M354 26 A3 3 0 0 0 357 23"/>
  </g>
  <circle cx="345" cy="15" r="2.2" class="tile-fill"/>
</svg>
